[constants]
T_gas = 800
T_electrons = 1.5
nO2 = 100000000000000.0
nAr = 0
ne = 1000000000000.0
pAr = 0.0
pO2 = 1.0
mO = "16amu"
mO2 = "32amu"
mO3 = "48amu"
mO4 = "64amu"
mAr = "40amu"
gamma_O = 0.1
gamma_O_metastable = 1.0
gamma_O2 = 0.007
gamma_O3 = 0.0
gamma_Ar = 1.0

[system]
reaction_file = "input.reactions"
radius = 32.5e-3
L = 100e-3
P = 425
h_factor = "thorsteinsson"
vsheath_solve_method = "flux_interpolation"
t_end = 1.0
dt_start = 1e-12
total_pressure_mTorr = 10.0
plasma_potential = 100
T_e_min_eV = 1.0
T_e_max_eV = 4.0

[species.e]
charge = -1
mass = "me"
solve_dens = true
solve_temp = true
T_eV = "T_electrons"
density = "ne"

[species.O2]
charge = 0
mass = "mO2"
solve_dens = true
solve_temp = false
T = "T_gas"
p = "pO2"
gamma = "gamma_O2"

[species."O2+"]
